<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#572c0a" />
    <title>SoftStock</title>
    <meta name="description" content="SoftStock: inventory for Softbound Café" />
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="./fonts/playfair-display-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <img class="brand-logo" src="./assets/logo-mark.png" alt="Softbound Café logo" width="52" height="52" />
      <div class="brand-text">
        <h1>SoftStock</h1>
        <p>Softbound Café stockroom</p>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-view="dashboard"><svg class="tab-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="8" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.5"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.5"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.5"/></svg><span class="tab-label">Dashboard</span></button>
      <button class="tab" data-view="inventory"><svg class="tab-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16z"/><path d="M3.5 8 12 12.5 20.5 8M12 12.5v8"/></svg><span class="tab-label">Inventory</span></button>
      <button class="tab" data-view="insights"><svg class="tab-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.8 4.7 4.7 1.8-4.7 1.8L12 16.5l-1.8-4.7L5.5 10l4.7-1.8z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg><span class="tab-label">AI Insights</span></button>
    </nav>

    <main>
      <section id="view-dashboard" class="view">
        <h2>Dashboard</h2>
        <div id="dashboard-content"></div>
      </section>

      <section id="view-inventory" class="view hidden">
        <h2>Inventory</h2>
        <div id="inventory-content"></div>
      </section>

      <section id="view-insights" class="view hidden">
        <h2>AI Demand Insights</h2>
        <div id="insights-content"></div>
      </section>
    </main>

    <div id="message" class="message hidden"></div>

    <!-- type="module" is REQUIRED because our JS files use import/export -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
